<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message sent — Carlos Mendoza</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; }
      .box { max-width: 460px; }
      h1 { font-size: 2rem; letter-spacing: -0.02em; margin-bottom: 10px; }
      p { color: var(--muted); margin-bottom: 24px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Thanks — message sent.</h1>
      <p>I'll get back to you soon. Taking you back to the portfolio in a few seconds…</p>
      <a class="btn" href="./">Back to portfolio</a>
    </div>
    <script>
      setTimeout(() => (window.location.href = "./"), 6000);
    </script>
  </body>
</html>
